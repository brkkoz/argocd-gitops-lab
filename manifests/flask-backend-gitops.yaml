apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-backend-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-backend-gitops
  template:
    metadata:
      labels:
        app: flask-backend-gitops
    spec:
      containers:
        - name: backend
          image: ghcr.io/brkkoz/three-tier-app-backend:8f94c9fa16c22b1bcb3977f71127c2509818dccb
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend-gitops
  annotations:
    gitops-autosync-test: "20261114150928"
spec:
  selector:
    app: flask-backend-gitops
  ports:
    - port: 5000
      targetPort: 5000
